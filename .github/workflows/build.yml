name: Build VrShare

# NOTE: workflow files cannot be pushed via the GitHub API (App permission),
# so this file is added once through the GitHub web UI. Afterwards everything
# is automatic: the first run unpacks the full source tree from the tarball
# below, commits it, builds the Windows installer + Android APK, and publishes
# the v1.0.0 GitHub Release.
on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

# One-shot source tarball (full VrShare source tree). Downloaded once by the
# bootstrap job, committed to git, then never needed again.
env:
  SRC_TARBALL_URL: "https://muse.ai/files/1327042927161998/2392524227948833/sw20excn47okkyjpwrdn7v3v/vrshare-src.tar.gz"

jobs:
  # ---- Unpack the source tarball and commit it to git (runs once) ----
  bootstrap-source:
    name: Commit source tree
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and extract source tarball
        run: |
          curl -sL --max-time 180 "$SRC_TARBALL_URL" -o /tmp/vrshare-src.tar.gz
          tar xzf /tmp/vrshare-src.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f docs/_push_test.txt
          find . -maxdepth 2 -name "*.tar.gz" -delete

      - name: Commit source to git
        run: |
          git config user.name "vrshare-bot"
          git config user.email "vrshare-bot@users.noreply.github.com"
          git add -A
          git status --short | head -10
          git commit -m "VrShare v1.0.0: full source tree (desktop + android + protocol spec)" || echo "nothing to commit"
          git push origin HEAD:main

  # ---------------- Windows desktop installer (Tauri v2 + Rust) ----------------
  windows:
    name: Windows installer
    needs: bootstrap-source
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout latest main (includes bootstrapped source)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore binary assets (icons stored as base64 text in repo)
        run: |
          $iconsDir = "desktop/src-tauri/icons"
          [IO.File]::WriteAllBytes("$iconsDir/icon.png", [Convert]::FromBase64String((Get-Content "$iconsDir/icon.png.b64" -Raw)))
          [IO.File]::WriteAllBytes("$iconsDir/icon.ico", [Convert]::FromBase64String((Get-Content "$iconsDir/icon.ico.b64" -Raw)))
          Get-ChildItem $iconsDir

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI (cargo subcommand)
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          tauriScript: cargo tauri

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: vrshare-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # ---------------- Android APK (Kotlin, unsigned release) ----------------
  android:
    name: Android APK
    needs: bootstrap-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main (includes bootstrapped source)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore Gradle wrapper jar (stored as base64 text in repo)
        working-directory: android
        run: |
          base64 -d gradle/wrapper/gradle-wrapper.jar.b64 > gradle/wrapper/gradle-wrapper.jar
          ls -la gradle/wrapper/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" | tail -5
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vrshare-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ---------------- Publish GitHub Release with both binaries ----------------
  release:
    name: Publish Release v1.0.0
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release and upload binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --title "VrShare v1.0.0" --notes "First public release of VrShare."
          find artifacts -type f \( -name "*.exe" -o -name "*.apk" \) -exec gh release upload v1.0.0 {} --clobber \;
          echo "Release published."
