[package]
name = "vrshare-desktop"
version = "1.0.0"
edition = "2021"
description = "VrShare - share files, clipboard and control your PC over your local WiFi network"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
rcgen = "0.13"
rustls = "0.23"
mdns-sd = "0.13"
arboard = "3"
enigo = "0.6"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls-manual-roots", "stream"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
dirs = "5"
rand = "0.9"
anyhow = "1"
bytes = "1"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
